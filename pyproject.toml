[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosc520-assignment2"
version = "0.1.0"
description = "B-tree, B+ tree and skip-list algorithms with reproducible benchmarks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
notebook = [
    "matplotlib>=3.9,<4", "numpy>=2,<3", "jupyterlab>=4,<5",
    "ipykernel>=6,<8", "nbformat>=5,<6", "nbclient>=0.10,<1", "nbconvert>=7,<8",
]

[tool.setuptools.packages.find]
where = ["src"]
